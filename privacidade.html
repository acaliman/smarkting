<!doctype html><meta charset="utf-8"><title>Privacidade — smarkting-backup</title>
<h1>Política de privacidade</h1>
<p>O smarkting-backup é usado apenas por seu dono, André Caliman, para copiar
backups criptografados para o próprio Google Drive. Ele acessa somente os arquivos
que ele mesmo cria (escopo drive.file), não lê nenhum outro arquivo do Drive e não
compartilha dados com terceiros.</p>
